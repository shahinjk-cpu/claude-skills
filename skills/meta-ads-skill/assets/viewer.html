<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta Ad Mockups</title>
<style>
/* ============================================================ app shell */
:root{
  --ui-bg:#f4f5f7; --ui-panel:#ffffff; --ui-text:#1c1e21; --ui-sub:#606770; --ui-line:#dadde1; --ui-accent:#1b74e4;
  --ok:#1f9d55; --warn:#d97706; --bad:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ui-bg:#121314; --ui-panel:#1d1f21; --ui-text:#e4e6eb; --ui-sub:#a0a4aa; --ui-line:#34373a; --ui-accent:#4a90ff; }
}
:root[data-theme="dark"]{ --ui-bg:#121314; --ui-panel:#1d1f21; --ui-text:#e4e6eb; --ui-sub:#a0a4aa; --ui-line:#34373a; --ui-accent:#4a90ff; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ui-bg);color:var(--ui-text);font:14px/1.4 -apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#bar{position:sticky;top:0;z-index:50;background:var(--ui-panel);border-bottom:1px solid var(--ui-line);padding:8px 16px}
#bar .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
#bar .row + .row{margin-top:8px}
#bar h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap}
#bar select.libsel{font-weight:700;max-width:300px}
#bar a.ib{text-decoration:none;color:inherit}
#bar select{font:inherit;font-size:13px;max-width:260px;padding:4px 6px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-panel);color:var(--ui-text)}
.seg{display:inline-flex;border:1px solid var(--ui-line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;line-height:1.25;text-align:left;border:0;border-right:1px solid var(--ui-line);background:transparent;color:var(--ui-text);padding:5px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button small{display:block;font-size:11px;font-weight:400;color:var(--ui-sub)}
.seg button.on{background:var(--ui-accent);color:#fff}
.seg button.on small{color:rgba(255,255,255,.85)}
.fld{display:flex;align-items:center;gap:6px}
.fld > .lb{font-size:12px;color:var(--ui-sub)}
.fixed{padding:4px 10px;border-radius:6px;background:var(--ui-bg);color:var(--ui-sub);font-size:13px;white-space:nowrap}
.ib{font:inherit;font-size:13px;line-height:1.2;border:1px solid var(--ui-line);background:var(--ui-panel);color:var(--ui-text);border-radius:6px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;user-select:none}
.ib:hover{border-color:var(--ui-sub)}
.ib:disabled{opacity:.35;cursor:default;border-color:var(--ui-line)}
.cnt{font-size:12px;color:var(--ui-sub);white-space:nowrap}
.zoomv{min-width:38px;text-align:center;font-size:13px}
details.menu{position:relative}
details.menu > summary{list-style:none}
details.menu > summary::-webkit-details-marker{display:none}
details.menu[open] > summary{border-color:var(--ui-accent)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:12px 14px;width:max-content;max-width:min(380px,90vw);display:flex;flex-direction:column;gap:12px;font-size:13px}
.pop.right{left:auto;right:0}
.pop > *{flex-shrink:0}   /* a menu taller than the window scrolls; nothing in it gets squashed */
.pop .opt{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;align-items:start;cursor:pointer;color:var(--ui-text)}
.pop .opt input{margin:2px 0 0}
.pop .opt small,.pop .note{grid-column:2;color:var(--ui-sub);font-size:12px}
.pop .fld{justify-content:space-between}
.pop .fld > .lb{font-size:13px;color:var(--ui-text);min-width:60px}
.pop .fld select{flex:1}
.pop p{margin:0}
.pop .eh{font-weight:700;margin-top:4px}
.pop .opt.dis{opacity:.5;cursor:default}
.pop .segsm button{padding:5px 10px}
.pop .picklist{max-height:200px;overflow:auto;border:1px solid var(--ui-line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.pop .picklist label{display:flex;gap:6px;align-items:flex-start;cursor:pointer;font-size:12px}
.pop .picklist .pg{font-size:11px;font-weight:700;color:var(--ui-sub);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.pop .exppls{flex-wrap:wrap;gap:6px}
.pop .exppls select{flex:1 1 30%;min-width:0;max-width:none}
.pop .expin{font:inherit;font-size:12px;padding:5px 7px;border:1px solid var(--ui-line);border-radius:6px;background:var(--ui-bg);color:var(--ui-text);width:100%;resize:vertical}
.pop details.expask > summary{cursor:pointer;font-size:12px;color:var(--ui-sub)}
.pop details.expask > * + *{margin-top:8px}
.pop .expf{display:flex;align-items:flex-start;gap:4px;font-size:12px}
.pop .expf > a:first-child{color:var(--ui-accent);overflow-wrap:anywhere;flex:1;min-width:0}
.pop .expf .fi,.fi{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-top:-4px;border-radius:6px;color:var(--ui-sub)}
.pop .expf .fi:hover{background:var(--ui-bg);color:var(--ui-text)}
.pop{max-height:calc(100vh - 120px);overflow-y:auto;overflow-x:hidden}
.selbar{background:color-mix(in srgb,var(--ui-accent) 10%,var(--ui-panel));border:1px solid color-mix(in srgb,var(--ui-accent) 40%,var(--ui-line));border-radius:8px;padding:6px 10px}
.selbar b{font-size:13px}
.ib.pri{background:var(--ui-accent);border-color:var(--ui-accent);color:#fff}
.pickbox{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ui-text);white-space:nowrap}
.pickbox input{width:16px;height:16px;margin:0;accent-color:var(--ui-accent);cursor:pointer}
.tile-h .pickbox{align-self:center}
.tile.picked > .zoomable,.tile.picked > .tile-h + .zoomable{outline:3px solid var(--ui-accent);outline-offset:3px;border-radius:4px}
table.mx tr.picked th.ad{background:color-mix(in srgb,var(--ui-accent) 14%,var(--ui-panel))}
table.mx th.ad .pickbox{margin-right:6px;vertical-align:-3px}
.nbadge{background:var(--ui-accent);color:#fff;border-radius:9px;font-size:11px;font-weight:600;padding:0 6px;line-height:16px}
.rhs{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.ib.on{background:var(--ui-text);color:var(--ui-panel);border-color:var(--ui-text)}
.key summary{border:0;background:transparent;color:var(--ui-sub);font-size:12px;gap:10px}
.key .dot{margin-right:4px;vertical-align:-1px}
.sec-h{font-size:13px;font-weight:700;margin:6px 0 12px;color:var(--ui-text)}
.sec + .sec{margin-top:30px}
.adid{font-weight:400;color:var(--ui-sub);font-size:11px}
@media (max-width:700px){#bar{position:static}.seg button small{display:none}.rhs{margin-left:0}}
#main{padding:20px 16px 60px}
.summary{font-size:12px;color:var(--ui-sub);margin:0 0 14px}
.tiles{display:flex;flex-wrap:wrap;gap:28px 24px;align-items:flex-start}
.tile{display:flex;flex-direction:column;gap:6px}
.tile-h{display:flex;gap:6px;align-items:baseline;font-size:12px;max-width:var(--tw,400px)}
.tile-h b{font-size:13px}
.tile-h .why{color:var(--ui-sub);font-size:11px}
.pill[title]{cursor:help}
.pill{font-size:11px;font-weight:600;padding:1px 6px;border-radius:9px;white-space:nowrap}
.pill.actual{background:#e3f6ea;color:var(--ok)} .pill.simulated{background:#fdf0dc;color:var(--warn)} .pill.not_eligible,.pill.excluded{background:#f9e1de;color:var(--bad)}
.reasons{font-size:11px;color:var(--ui-sub);margin:0;padding-left:16px;max-width:var(--tw,400px)}
.reasons li.copy{color:var(--warn)}
.empty{color:var(--ui-sub);padding:40px;text-align:center}
table.mx{border-collapse:collapse;font-size:12px;background:var(--ui-panel)}
table.mx th,table.mx td{border:1px solid var(--ui-line);padding:4px 6px;text-align:center;vertical-align:top}
table.mx th.ad{text-align:left;max-width:240px;font-weight:600}
table.mx thead th{cursor:help;position:sticky;top:var(--barh,90px);background:var(--ui-panel);z-index:5}
table.mx td{cursor:pointer}
table.mx td:hover{outline:2px solid var(--ui-accent)}
.mxthumb{width:140px;height:220px;overflow:hidden;position:relative;margin:0 auto}
.mxthumb > .scaler{transform:scale(.33);transform-origin:0 0;position:absolute;left:0;top:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.dot.actual{background:var(--ok)} .dot.simulated{background:var(--warn)} .dot.not_eligible{background:var(--bad)} .dot.excluded{background:#999}

/* ============================================================ export mode */
body.export{background:#01fe02}
body.export #bar{display:none}
body.export #main{padding:0}
body.export .tiles{display:block}
body.export .tile-h,body.export .reasons{display:none}

/* ============================================================ mockup base */
.mk{--w:393px;position:relative;width:var(--w);overflow:hidden;font-family:-apple-system,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:var(--t1);background:var(--bg)}
.mk *{box-sizing:border-box}
.mk.desk{--w:1280px}
.mk svg{display:block}
.mk img,.mk video{display:block}
.mk.fb{--padbg:#f0f2f5;--bg:#fff;--card:#fff;--feedbg:#c9ccd1;--t1:#080809;--t2:#65686c;--btn:#e2e5e9;--linkbg:#f0f2f5;--line:#ced0d4;--blue:#0866ff;--hover:#f2f2f2}
.mk.fb.dark{--padbg:#3a3b3c;--bg:#242526;--card:#242526;--feedbg:#18191a;--t1:#e2e5e9;--t2:#b0b3b8;--btn:#3a3b3c;--linkbg:#3a3b3c;--line:#3e4042;--blue:#5aa7ff}
.mk.ig{--bg:#fff;--card:#fff;--t1:#000;--t2:#737373;--line:#dbdbdb;--btn:#efefef;--blue:#0095f6;--ctabar:#efefef}
.mk.ig.dark{--bg:#000;--card:#000;--t1:#f5f5f5;--t2:#a8a8a8;--line:#262626;--btn:#363636;--blue:#0095f6;--ctabar:#262626}
.frame{display:inline-block;padding:14px;border-radius:62px;background:#111;box-shadow:0 0 0 2px #333,0 10px 40px rgba(0,0,0,.25)}
.frame > .mk{border-radius:48px;height:852px}
.frame > .mk > .scroll{height:100%;overflow-y:auto;scrollbar-width:none}
.frame > .mk > .scroll::-webkit-scrollbar{display:none}
.frame > .mk > .scroll{display:flex;flex-direction:column}
.frame > .mk > .scroll > *{flex-shrink:0}
.frame > .mk > .scroll > .fbapp,.frame > .mk > .scroll > .igapp,.frame > .mk > .scroll > .iggrid{flex:1 0 auto}
.frame > .mk > .scroll > .sb{position:sticky;top:0;z-index:30}
.frame > .mk > .scroll > .fbhdr,.frame > .mk > .scroll > .ighdr{position:sticky;top:54px;z-index:30;background:var(--card)}
.frame > .mk > .scroll > .fbtabs,.frame > .mk > .scroll > .igtabs{position:sticky;bottom:0;z-index:30}
.frame > .mk > .scroll > .igpill{position:sticky;bottom:22px}

/* status bar */
.sb{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 44px;font-weight:600;font-size:17px;letter-spacing:-.2px;color:var(--t1);background:var(--bg)}
.sb .ic{display:flex;gap:6px;align-items:center}
.sb.light-on-dark{color:#fff;background:transparent;position:absolute;top:0;left:0;right:0;z-index:5}

/* generic */
.av{border-radius:50%;object-fit:cover;flex:none;background:#bcc0c4;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden}
.ph{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;color:rgba(255,255,255,.88);text-align:center}
.ph .phin{padding:18px;max-width:86%}
.ph .phr{font:600 13px/1.2 ui-monospace,Consolas,monospace;opacity:.85;letter-spacing:.3px}
.ph .phl{font-size:15px;font-weight:600;margin-top:8px;line-height:1.3}
.ph .phk{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px)}
.media{position:relative;overflow:hidden;background:#000;width:100%}
.media > .fit{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media > .blurbg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(28px) brightness(.8);transform:scale(1.1)}
.media > .center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%}
.media > .center > *{width:100%;height:100%;object-fit:cover}
.vidbadge{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.more{color:var(--t2);font-weight:600;cursor:pointer}
.ig .more{font-weight:400}
.clamp{white-space:pre-wrap;word-wrap:break-word}

/* overlays */
.ov-safe{position:absolute;z-index:40;pointer-events:none;background:rgba(255,40,80,.28);border:1px dashed rgba(255,60,90,.9)}
.ov-safe span{position:absolute;left:6px;top:4px;font:600 10px/1.2 ui-monospace,Consolas,monospace;color:#fff;text-shadow:0 1px 2px #000;background:rgba(0,0,0,.35);padding:1px 4px;border-radius:3px}
.ov-tr{outline:1.5px dashed #e8590c;outline-offset:2px;position:relative}
.ov-tag{position:absolute;z-index:41;right:0;top:-16px;font:600 10px/14px ui-monospace,Consolas,monospace;background:#e8590c;color:#fff;padding:0 5px;border-radius:3px;white-space:nowrap;pointer-events:none}
.ov-tag.bad{background:#c0392b}
.ov-badge{position:absolute;z-index:45;left:8px;top:8px;font:600 11px/1.3 -apple-system,"Segoe UI",sans-serif;background:rgba(217,119,6,.95);color:#fff;padding:3px 8px;border-radius:6px;max-width:80%;pointer-events:none}
.ov-badge.top{top:auto;bottom:52%}

/* ============================================================ FB feed post */
.fbapp{background:var(--feedbg)}
.fbhdr{background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px;height:52px}
.fbword{font:700 29px/1 "Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-1.1px;color:var(--blue)}
.dark .fbword{color:#e2e5e9}
.fbhdr .r{display:flex;gap:10px}
.circbtn{width:38px;height:38px;border-radius:50%;background:var(--btn);display:flex;align-items:center;justify-content:center;color:var(--t1)}
.fbtabs{height:50px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;color:var(--t2)}
.fbtabs .on{color:var(--blue)}
.post{background:var(--card);margin-top:8px}
.post .ph-h{display:flex;align-items:center;gap:8px;padding:12px 12px 0}
.post .who{flex:1;min-width:0}
.post .nm{font-size:15px;font-weight:600;line-height:20px;display:flex;align-items:center;gap:4px;color:var(--t1)}
.post .sp{font-size:13px;line-height:16px;color:var(--t2);display:flex;align-items:center;gap:4px}
.post .acts{display:flex;gap:14px;color:var(--t2);align-items:center}
.post .ptxt{font-size:15px;line-height:20px;padding:8px 12px 10px;color:var(--t1)}
.linkbar{background:var(--linkbg);display:flex;align-items:center;gap:10px;padding:10px 12px}
.linkbar .tx{flex:1;min-width:0}
.linkbar .dl{font-size:12px;line-height:16px;color:var(--t2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkbar .hl{font-size:16px;line-height:20px;font-weight:600;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.linkbar .ds{font-size:14px;line-height:18px;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mk.fb.dark .linkbar .fbcta{background:#4e4f50}
.fbcta{flex:none;background:var(--btn);color:var(--t1);font-size:15px;font-weight:600;border-radius:6px;padding:0 12px;height:36px;display:flex;align-items:center;white-space:nowrap}
.eng{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:15px;color:var(--t2)}
.eng .rx{display:flex;align-items:center;gap:6px}
.eng .rx .stack{display:flex}
.eng .rx .stack svg{margin-left:-3px;border:2px solid var(--card);border-radius:50%;box-sizing:content-box}
.eng .rx .stack svg:first-child{margin-left:0}
.actrow{display:flex;justify-content:space-around;border-top:1px solid var(--line);margin:0 12px;padding:4px 0 6px;color:var(--t2);font-size:15px;font-weight:600}
.actrow div{display:flex;align-items:center;gap:6px;padding:6px 8px}
.car{display:flex;gap:8px;overflow-x:auto;padding:0 12px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car .cd{flex:none;width:var(--cw,300px);border:1px solid var(--line);border-radius:8px;overflow:hidden;scroll-snap-align:start;background:var(--card)}
.car .cd .cb{display:flex;align-items:center;gap:8px;padding:10px}
.car .cd .cb .tx{flex:1;min-width:0}
.car .cd .hl{font-size:15px;line-height:20px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car .cd .ds{font-size:13px;line-height:16px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car .cd .fbcta{height:32px;font-size:14px}
.organic .ptxt{padding-bottom:10px}

/* FB desktop */
.desk.fb{--feedbg:#f0f2f5;background:var(--feedbg)}
.desk.fb.dark{--feedbg:#18191a}
.dtop{height:56px;background:var(--card);display:flex;align-items:center;padding:0 16px;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.12);position:relative;z-index:2}
.dlogo{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:flex-end;justify-content:center;font:700 34px/1 "Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
.dark .dlogo{background:#0866ff}
.dsearch{width:240px;height:40px;border-radius:20px;background:var(--linkbg);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--t2);font-size:15px}
.dmid{flex:1;display:flex;justify-content:center;gap:8px;color:var(--t2)}
.dmid div{width:110px;height:56px;display:flex;align-items:center;justify-content:center}
.dmid div.on{color:var(--blue);border-bottom:3px solid var(--blue)}
.dright{display:flex;gap:8px}
.dbody{display:flex;justify-content:space-between;padding:0 8px}
.dleft{width:300px;padding:12px 8px;color:var(--t1);font-size:15px;font-weight:600}
.dleft .drow{display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 8px;border-radius:8px;line-height:20px}
.dleft .drow > span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dico{width:36px;height:36px;flex:none;display:block}
.dico.sq{border-radius:8px}
.dico.metaai{border-radius:50%;background:conic-gradient(from 210deg,#0082fb,#a33bff,#ff4f9a,#ffb23f,#0082fb);-webkit-mask:radial-gradient(circle,transparent 9px,#000 9.5px,#000 15px,transparent 15.5px);mask:radial-gradient(circle,transparent 9px,#000 9.5px,#000 15px,transparent 15.5px)}
.dmore{width:36px;height:36px;border-radius:50%;background:var(--btn);display:flex;align-items:center;justify-content:center;flex:none}
.dsep{border-top:1px solid var(--line);margin:8px 8px}
.dhead{font-size:17px;font-weight:600;color:var(--t2);padding:12px 8px 4px}
.dcomp{background:var(--card);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;padding:12px 16px;margin-bottom:16px}
.dcomp .in{flex:1;height:40px;border-radius:20px;background:var(--btn);display:flex;align-items:center;padding:0 12px;font-size:17px;color:var(--t2)}
.dstories{display:flex;gap:8px;margin-bottom:16px}
.dst{position:relative;width:112px;height:200px;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.dst::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.45))}
.dst .ring{position:absolute;top:12px;left:12px;z-index:2;padding:2px;border-radius:50%;border:3px solid #0866ff;background:var(--card)}
.dst .nm{position:absolute;left:12px;right:8px;bottom:10px;z-index:2;color:#fff;font-size:13px;font-weight:600;line-height:16px}
.dst.create{background:var(--card)}
.dst.create::after{display:none}
.dst.create .ph{height:150px}

function readHash(){
  const h = location.hash.replace(/^#/, "");
  const q = new URLSearchParams(h.replace(/^export&?/, ""));
  if (h.startsWith("export")) state.export = true;
  for (const [k, v] of q) {
    if (["safe","trunc","badges","frame","dark","thumbs"].includes(k)) state[k] = v === "1";
    else if (k === "zoom") state.zoom = parseFloat(v) || 0.8;
    else if (k === "card") state.card = parseInt(v) || 0;
    else if (k in state) state[k] = v;
  }
  if (state.export) { state.badges = q.get("badges") === "1"; }
  // Old or hand-edited links must not leave a view silently empty: drop values this data doesn't have.
  if (state.status === "ready") state.status = "actual";               // renamed in v1.1.0
  if (!["", "actual", "simulated"].includes(state.status)) state.status = "";
  if (!["feed", "compare", "gallery", "matrix"].includes(state.mode)) state.mode = "feed";
  if (!P[state.pl]) state.pl = P.fb_feed_mobile ? "fb_feed_mobile" : D.placements[0].id;
  if (state.ad && !AD[state.ad]) state.ad = D.ads[0]?.id;
  if (state.group && !D.ads.some(a => a.group === state.group)) state.group = "";
  if (state.brand && !D.ads.some(a => a.brand === state.brand)) state.brand = "";
}
function writeHash(){
  if (state.export) return;
  const q = new URLSearchParams();
  for (const k of ["mode","ad","pl","group","brand","status"]) if (state[k]) q.set(k, state[k]);
  for (const k of ["safe","trunc","badges","frame","dark","thumbs"]) q.set(k, state[k] ? "1" : "0");

/* Settings survive closing the page and switching libraries. Look and layout settings are shared by
   every library; the chosen ad and filters are kept per library. A link's own #settings win over
   stored ones. Never used for PNG export, which must render exactly what its URL says. */
const PREF_GLOBAL = ["mode","pl","safe","trunc","badges","frame","dark","thumbs","zoom"];
const PREF_LOCAL = ["ad","group","brand","status"];
const prefKey = () => "meta-ads:lib:" + (LIB_ID || (D.campaign && D.campaign.name) || "default");
function loadPrefs(){
  try {
    const g = JSON.parse(localStorage.getItem("meta-ads:prefs") || "{}");
    const l = JSON.parse(localStorage.getItem(prefKey()) || "{}");
    for (const k of PREF_GLOBAL) if (k in g) state[k] = g[k];
    for (const k of PREF_LOCAL) if (k in l) state[k] = l[k];
    if (Array.isArray(l.picked)) l.picked.forEach(id => { if (AD[id]) EXP.picked.add(id); });
    if (["this", "shown", "pick"].includes(l.scope)) EXP.scope = l.scope;
  } catch (e) { /* storage blocked: defaults */ }
}
function savePrefs(){
  if (state.export) return;
  try {
    localStorage.setItem("meta-ads:prefs", JSON.stringify(Object.fromEntries(PREF_GLOBAL.map(k => [k, state[k]]))));
    localStorage.setItem(prefKey(), JSON.stringify({...Object.fromEntries(PREF_LOCAL.map(k => [k, state[k]])), picked: [...EXP.picked], scope: EXP.scope}));
  } catch (e) { /* storage blocked or full: settings just won't persist */ }
}

/* media element sized by box aspect, honouring fit mode */
function mediaEl(slot, opts = {}){

  const m = slot.media && M(slot.media);

    else {
      const narrow = m.aspect < box && slot.mode !== "fill";
      const cs = narrow ? `width:${(m.aspect/box)*100}%;left:${(1-m.aspect/box)*50}%;height:100%;top:0;transform:none;` : "";
      html = `<div class="ph" style="position:absolute;inset:0;background:${slot.mode === "pad" ? "var(--padbg,#f0f2f5)" : "#111"}"></div><div class="center" style="aspect-ratio:${m.aspect};${cs}">${phBox(m,"100%","100%",opts)}</div>`;

/* truncation: elements with data-clamp are cut to N lines with a "more" label after insertion */
function clampAll(root){
  root.querySelectorAll("[data-clamp]").forEach(el => {
    const lines = +el.dataset.clamp, text = el.dataset.text || "", more = el.dataset.more || "… See more";
    const prefix = el.dataset.prefix ? decodeURIComponent(el.dataset.prefix) : "";
    const cs = getComputedStyle(el);
    const lh = parseFloat(cs.lineHeight) || 20;
    const max = lines * lh + (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0) + 1;
    el.innerHTML = prefix + esc(text);
    let cut = text.length, truncated = false;
    if (lines > 0 && el.scrollHeight > max) {
      truncated = true;
      let lo = 0, hi = text.length;
      const sep = /^…/.test(more) ? "" : " ";
      while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        el.innerHTML = prefix + esc(text.slice(0, mid).trimEnd()) + sep + `<span class="more">${esc(more)}</span>`;
        if (el.scrollHeight > max) hi = mid - 1; else lo = mid;
      }
      cut = lo;
      el.innerHTML = prefix + esc(text.slice(0, lo).trimEnd()) + sep + `<span class="more" data-expand>${esc(more)}</span>`;
      const span = el.querySelector("[data-expand]");
      if (span && !state.export) span.onclick = () => { el.innerHTML = prefix + esc(text); };
    }
    if (state.trunc && text) {
      el.classList.add("ov-tr");
      const lim = +el.dataset.limit || 0;
      const tag = document.createElement("div");
      tag.className = "ov-tag" + (lim && text.length > lim ? " bad" : "");
      tag.textContent = truncated ? `${cut}/${text.length} chars shown · ${lines} lines` : `${text.length} chars${lim ? ` / rec. ${lim}` : ""}`;
      el.appendChild(tag);
    }
  });
  root.querySelectorAll("[data-lim]").forEach(el => {
    if (!state.trunc) return;
    const lim = +el.dataset.lim, n = (el.dataset.len ? +el.dataset.len : el.textContent.length);
    if (!n) return;
    el.classList.add("ov-tr");
    const tag = document.createElement("div");
    tag.className = "ov-tag" + (lim && n > lim ? " bad" : "");
    tag.textContent = `${n}${lim ? "/" + lim : ""}`;
    el.style.position = "relative"; el.appendChild(tag);
  });
}

}

    try {
      const r = await saveBlob(`${dkSlug(title)}-${EXP.layout}-${dkDate()}.pptx`, "PowerPoint", PPTX_MIME, ".pptx", async () => {
        const out = await buildPptx(ads, t => { msg.textContent = t; });
        if (out.missing) note = ` ${out.missing} picture${out.missing === 1 ? " was" : "s were"} missing; re-rendering the library should fix that.`;
        return out.blob;
      });
      msg.textContent = r + note;
    } catch (e) { msg.textContent = e && e.name === "AbortError" ? "Cancelled." : "Couldn’t make the PowerPoint: " + (e && e.message || e); }
    spp.disabled = false;
  };
  const sp = bar.querySelector("[data-savepdf]");
  if (sp) sp.onclick = async () => {
    const msg = bar.querySelector("[data-savemsg]");
    sp.disabled = true;
    try { await printDeck(expAds(adsF), t => { msg.textContent = t; }); msg.textContent = ""; }
    catch (e) { msg.textContent = "Couldn’t make the PDF: " + (e && e.message || e); }
    sp.disabled = false;
  };
  bar.querySelectorAll("[data-exppl]").forEach(s => s.onchange = () => { EXP.pls[+s.dataset.exppl] = s.value; redraw(); });
  const one = bar.querySelector("[data-expone]"); if (one) one.onchange = () => { EXP.one = one.value; redraw(); };
  const ti = bar.querySelector("[data-exptitle]"); if (ti) ti.oninput = () => { EXP.title = ti.value; const r = bar.querySelector("[data-expreq]"); if (r) r.value = expRequest(adsF); };
  const cp = bar.querySelector("[data-copy]");
  if (cp) cp.onclick = async () => {
    const box = bar.querySelector("[data-expreq]");
    try { await navigator.clipboard.writeText(box.value); } catch (e) { box.select(); document.execCommand("copy"); }
    cp.textContent = "Copied. Now paste it to Claude"; setTimeout(() => { cp.textContent = "Copy request"; }, 2500);
  };
  if (pl) pl.scrollTop = keep;
}
/* Libraries: render.py marks a viewer that lives in a library (meta-ads/<library>/viewer/) with
   <meta name="meta-ads-library">. The shared list is ../../libraries.js, loaded after first paint. */
const LIB_ID = document.querySelector('meta[name="meta-ads-library"]')?.content || null;
let LIBS = null;
function libCtl(){
  const shared = D.share ? `<span class="fixed" style="cursor:help" title="A single-file copy made ${esc((D.share.created || "").replace("T", " "))}, for review. These are mockups, not live ads.${D.share.videos_as_frames ? " Videos are shown as their cover frame, to judge layout, text and margins." : ""}">Shared copy${D.share.videos_as_frames ? " · videos as still frames" : ""}</span>` : "";
  const title = `<h1>${esc(D.campaign.name || "Ad mockups")}</h1>${shared}`;
  const libs = (LIBS && LIBS.libraries || []).filter(l => l.rendered);
  if (D.share) {   // a single-file copy: links back only when opened where it was made
    if (!libs.some(l => l.id === D.share.library)) return title;
    return `${title}<a class="ib" href="../viewer/index.html" title="This library's own viewer${D.share.videos_as_frames ? ", with videos playing" : ""}">Open full library</a><a class="ib" href="../../index.html" title="All libraries, with what's in each">All libraries</a>`;
  }
  if (!LIB_ID || !LIBS) return title;
  const home = `<a class="ib" href="../../index.html" title="All libraries, with what's in each">All libraries</a>`;
  if (libs.length < 2) return `${title}${home}`;
  if (!libs.some(l => l.id === LIB_ID)) libs.unshift({id: LIB_ID, name: D.campaign.name || LIB_ID, ads: D.ads.length});
  return `<div class="fld"><span class="lb" style="cursor:help" title="Each library is its own set of ads, kept in its own folder. Switching keeps your view and overlays.">Library</span><select data-lib aria-label="Library" class="libsel">${libs.map(l => `<option value="${esc(l.id)}" ${l.id === LIB_ID ? "selected" : ""}>${esc(l.name)} (${l.ads} ad${l.ads === 1 ? "" : "s"})</option>`).join("")}</select>${home}</div>`;
}
function switchLibrary(id){
  if (!id || id === LIB_ID) return;
  const q = new URLSearchParams();
  for (const k of ["mode","pl"]) if (state[k]) q.set(k, state[k]);   // ad, group and brand belong to this library
  for (const k of ["safe","trunc","badges","frame","dark","thumbs"]) q.set(k, state[k] ? "1" : "0");
  q.set("zoom", state.zoom);
  location.href = "../../" + encodeURIComponent(id) + "/viewer/index.html#" + q.toString();
}
function stepAd(d){
  const list = filteredAds(); if (!list.length) return;
  const i = list.findIndex(a => a.id === state.ad);
  state.ad = list[Math.min(list.length - 1, Math.max(0, (i < 0 ? 0 : i) + d))].id; state.card = 0; go();
}
function stepPl(d){
  const ids = D.placements.map(p => p.id), i = ids.indexOf(state.pl);
  state.pl = ids[Math.min(ids.length - 1, Math.max(0, i + d))]; go();
}
function statusTitle(c){
  if (c.status === "actual") return "Actual: this placement shows your creative as supplied, so this should match what Meta shows.";
  if (c.status === "simulated") return "Simulated, approximated because: " + (c.reasons || []).join("; ");
  return (c.status || "").replace("_", " ") + ((c.reasons || []).length ? ": " + c.reasons.join("; ") : "");
}
const BRAND_RANK = {}; D.ads.forEach(a => { if (!(a.brand in BRAND_RANK)) BRAND_RANK[a.brand] = Object.keys(BRAND_RANK).length; });
const ADS_BY_BRAND = D.ads.map((a, i) => [a, i]).sort((x, y) => (BRAND_RANK[x[0].brand] - BRAND_RANK[y[0].brand]) || (x[1] - y[1])).map(x => x[0]);
function filteredAds(){   // grouped by brand (in order of first appearance), spec order within a brand
  return ADS_BY_BRAND.filter(a => (!state.group || a.group === state.group) && (!state.brand || a.brand === state.brand));
}
function statusOk(c){ return !state.status || c.status === state.status; }

/* ------------------------------------------------------------------ views */
/* Selecting ads to export: a checkbox in each tile's header (never inside the mockup itself,
   which PNG export and the Overview thumbnails reuse). Toggling doesn't re-render the mockups. */
let SELECTING = false;
const pickBox = (id, label = "") => SELECTING && !state.export && !D.share ? `<label class="pickbox" title="Include this ad in the export"><input type="checkbox" data-pick="${esc(id)}" ${EXP.picked.has(id) ? "checked" : ""}>${label}</label>` : "";
const pickedCls = id => SELECTING && EXP.picked.has(id) ? " picked" : "";
function tileHtml(title, c, inner, width, adId){
  const reasons = [...(c.reasons||[]).map(r => `<li>${esc(r)}</li>`), ...(c.copy||[]).map(r => `<li class="copy">${esc(r)}</li>`)].join("");
  return `<div class="tile${adId ? pickedCls(adId) : ""}" style="--tw:${width}px"${adId ? ` data-tile="${esc(adId)}"` : ""}><div class="tile-h">${adId ? pickBox(adId) : ""}<b>${title}</b><span class="pill ${c.status}" title="${esc(statusTitle(c))}">${c.status.replace("_"," ")}</span></div>${reasons && state.badges ? `<ul class="reasons">${reasons}</ul>` : ""}<div class="zoomable" style="zoom:${state.zoom}">${inner}</div></div>`;
}
const widthOf = p => p.device === "desktop" ? 1280 : 393;
function viewGallery(){
  const ad = AD[state.ad] || filteredAds()[0];
  if (!ad) return `<div class="empty">No ads match the filters.</div>`;
  state.ad = ad.id;
  const SECS = [["Facebook on phones", p => p.platform === "facebook" && p.device !== "desktop"], ["Instagram", p => p.platform === "instagram"], ["Facebook on desktop", p => p.platform === "facebook" && p.device === "desktop"]];
  const skipped = []; let n = 0;
  const secs = SECS.map(([title, test]) => {
    const parts = [];
    for (const p of D.placements.filter(test)) {
      const c = cell(ad, p.id);
      if (!statusOk(c)) continue;
      const html = mockup(ad.id, p.id);
      if (!html) { skipped.push(`${p.name} (${c.reasons[0] || c.status.replace("_", " ")})`); continue; }
      parts.push(tileHtml(esc(p.name), c, html, Math.round(widthOf(p) * state.zoom)));
    }
    n += parts.length;
    return parts.length ? `<div class="sec"><h2 class="sec-h">${title}</h2><div class="tiles">${parts.join("")}</div></div>` : "";
  }).join("");
  const fmt = {image: "Image", video: "Video", carousel: "Carousel"}[ad.format] || ad.format;
  return `<p class="summary"><b style="color:var(--ui-text)">${esc(adName(ad))}</b> · ${fmt} · ${esc(brandOf(ad).page_name)}${ad.group ? " · Group: " + esc(ad.group) : ""} · <span class="adid">ID ${esc(ad.id)}</span>${skipped.length ? `<br>Not shown here: ${esc(skipped.join(", "))}` : ""}</p>${n ? secs : `<div class="empty">${state.status ? `No ${esc(state.status)} mockups for this ad. Open Filter and set Status to “Actual and simulated” to see them all.` : "No placement can show this ad."}</div>`}`;
}
function viewCompare(){
  const p = P[state.pl];
  const parts = filteredAds().map(ad => {
    const c = cell(ad, p.id);
    if (!statusOk(c)) return "";
    const html = mockup(ad.id, p.id);
    const title = `${esc(adName(ad))} <span class="adid">${esc(ad.id)}</span>`;
    if (!html) return `<div class="tile${pickedCls(ad.id)}" data-tile="${esc(ad.id)}"><div class="tile-h">${pickBox(ad.id)}<b>${title}</b><span class="pill ${c.status}" title="${esc(statusTitle(c))}">${c.status.replace("_"," ")}</span></div><ul class="reasons"><li>${esc(c.reasons[0]||"")}</li></ul></div>`;
    return tileHtml(title, c, html, Math.round(widthOf(p) * state.zoom), ad.id);
  });
  const shown = parts.filter(Boolean).length;
  return `<p class="summary">Every ad as it appears in <b style="color:var(--ui-text)">${esc(p.name)}</b> · ${shown} ad${shown === 1 ? "" : "s"}</p>${shown ? `<div class="tiles">${parts.join("")}</div>` : `<div class="empty">No ads match the filters here.</div>`}`;
}
function viewFeed(){
  const ad = AD[state.ad] || filteredAds()[0];
  if (!ad) return `<div class="empty">No ads.</div>`;
  const p = P[state.pl], c = cell(ad, p.id);
  if (["fb_stories","ig_stories","fb_reels","ig_reels"].includes(p.template)) {
    const html = mockup(ad.id, p.id);
    const org = (i) => `<div class="mk fs ${p.platform==="instagram"?"ig":"fb"}"><div class="stage" style="background:${ORG[i].c}"></div>${statusBar(true)}<div class="sthdr"><div class="av" style="width:32px;height:32px;background:${hueFor(ORG[i].n)}">${initials(ORG[i].n)}</div><div class="who"><div class="nm">${ORG[i].n}</div><div class="sp">${2+i}h</div></div></div></div>`;
    if (!html) return `<div class="empty">${esc(c.reasons[0] || "Not eligible")}</div>`;
    return `<p class="summary">${esc(p.name)}: the ad between two organic ${p.template.includes("reels") ? "reels" : "stories"}, in viewing order.</p><div class="tiles zoomable" style="zoom:${state.zoom}">${org(0)}${html}${org(2)}</div>`;
  }
  const html = mockup(ad.id, p.id, {feed:true});
  if (!html) return `<div class="empty">${esc(c.reasons[0] || "Not eligible")}</div>`;
  const framed = p.device === "mobile" ? (state.frame ? html : `<div class="frame">${html.replace(/^<div class="mk([^"]*)"([^>]*)>/, `<div class="mk$1"$2><div class="scroll">`)}</div></div>`) : html;
  return `<p class="summary">${esc(p.name)}: the ad between ordinary posts. ${p.device === "mobile" ? "Scroll inside the phone to move through the feed." : "Scroll the page to move through the feed."}</p><div class="zoomable" style="zoom:${state.zoom}">${framed}</div>`;
}
function viewMatrix(){
  const ads = filteredAds();
  const head = `<thead><tr><th></th>${D.placements.map(p => `<th title="${esc(p.name)}">${esc(p.short)}</th>`).join("")}</tr></thead>`;
  const rows = ads.map(ad => `<tr class="${pickedCls(ad.id).trim()}" data-tile="${esc(ad.id)}"><th class="ad">${pickBox(ad.id)}${esc(adName(ad))}<br><span class="adid">${esc(ad.id)}</span></th>${D.placements.map(p => {
    const c = cell(ad, p.id);
    const inner = state.thumbs && (c.status === "actual" || c.status === "simulated") ? `<div class="mxthumb" data-lazy="${esc(ad.id)}|${p.id}"></div>` : `<span class="dot ${c.status}"></span>`;
    return `<td title="${esc(p.name + ": " + c.status + (c.reasons.length ? " — " + c.reasons.join("; ") : ""))}" data-go="${esc(ad.id)}|${p.id}">${inner}</td>`;
  }).join("")}</tr>`).join("");
  return `<p class="summary"><span class="dot actual"></span> actual &nbsp; <span class="dot simulated"></span> simulated &nbsp; <span class="dot not_eligible"></span> not eligible · Hover a column heading for the placement’s full name, or a cell for details. Click a cell to compare every ad in that placement.</p><table class="mx">${head}<tbody>${rows}</tbody></table>`;
}

/* ------------------------------------------------------------------ main */
function go(){
  const inList = filteredAds();
  if (inList.length && !inList.some(a => a.id === state.ad)) { state.ad = inList[0].id; state.card = 0; }
  writeHash();
  document.documentElement.dataset.theme = state.dark ? "dark" : "light";
  toolbar();
  const main = $("#main");
  main.innerHTML = ({gallery: viewGallery, compare: viewCompare, feed: viewFeed, matrix: viewMatrix}[state.mode] || viewFeed)();
  clampAll(main);
  if (state.mode === "feed") revealFeedAd(main);
  if (state.mode === "matrix") {
    main.querySelectorAll("table.mx .pickbox").forEach(l => l.onclick = e => e.stopPropagation());
    main.querySelectorAll("[data-go]").forEach(td => td.onclick = () => { const [a, p] = td.dataset.go.split("|"); state.ad = a; state.pl = p; state.mode = "compare"; state.group = AD[a].group || ""; go(); });
    const io = new IntersectionObserver(es => es.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target, [a, p] = el.dataset.lazy.split("|");
      const z = P[p].device === "desktop" ? 140/1280 : 140/393;
      el.innerHTML = `<div class="scaler" style="transform:scale(${z})">${mockup(a, p) || ""}</div>`;
      clampAll(el); io.unobserve(el);
    }), {rootMargin: "300px"});
    main.querySelectorAll("[data-lazy]").forEach(el => io.observe(el));
  }
}
/* In-feed mode opens with the ad on screen: scroll so it starts a little below the
   sticky header, leaving the end of the organic post above it visible. */
function revealFeedAd(main){
  const org = main.querySelector(".organic"), ad = org && org.nextElementSibling;
  if (!ad || ad.classList.contains("organic")) return;
  let box = ad.parentElement;
  while (box && box !== main && !(/(auto|scroll)/.test(getComputedStyle(box).overflowY) && box.scrollHeight > box.clientHeight)) box = box.parentElement;
  if (box && box !== main) {
    const br = box.getBoundingClientRect(), k = br.height / box.clientHeight || 1;   // CSS zoom factor
    box.scrollTop += (ad.getBoundingClientRect().top - br.top) / k - 230;
  } else {
    window.scrollBy(0, ad.getBoundingClientRect().top - 160);
  }
}
function exportView(){
  document.body.classList.add("export");
  const html = mockup(state.ad, state.pl, {}) || `<div class="empty">not eligible</div>`;
  $("#main").innerHTML = `<div id="shot" style="display:inline-block">${html}</div>`;
  clampAll($("#main"));
  // pin feed mockups to a phone-like minimum height so short posts still read as a screen
  document.title = "ready";
}
if (!/^#export/.test(location.hash)) loadPrefs();
readHash();
if (state.export) exportView(); else go();
if ((LIB_ID || (D.share && D.share.library)) && !state.export) {
  const s = document.createElement("script");
  s.src = "../../libraries.js?v=" + Date.now();   // fresh list even if another library was rendered since
  s.onload = () => { LIBS = window.META_ADS_LIBRARIES || null; toolbar(); };
  document.head.appendChild(s);                    // missing file (library moved on its own): no switcher
}
$("#main").addEventListener("change", e => { const c = e.target.closest("[data-pick]"); if (c) setPicked(c.dataset.pick, c.checked); });
document.addEventListener("click", e => {
  if (e.target.closest("details.menu, [data-selexport]")) return;
  document.querySelectorAll("#bar details.menu[open]").forEach(d => d.open = false);
});
document.addEventListener("keydown", e => {
  if (state.export || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "Escape") { document.querySelectorAll("#bar details.menu[open]").forEach(d => d.open = false); return; }
  if (e.target.closest("input, select, textarea")) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const d = e.key === "ArrowLeft" ? -1 : 1;
  if (state.mode === "feed" || state.mode === "gallery") { e.preventDefault(); stepAd(d); }
  else if (state.mode === "compare") { e.preventDefault(); stepPl(d); }
});
addEventListener("hashchange", () => { if (!state.export) { readHash(); go(); } });
</script>
</body>
</html>
