<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;background:transparent;overflow:hidden}
img{width:100%;height:100%;display:block;object-fit:cover}
</style></head><body><script>
// Place one image, optional shape mask (circle | squircle) and inset padding (fraction of size).
const J = window.JOB; const im = document.createElement('img'); im.src = J.src;
const pad = (J.pad || 0) * 100;
im.style.cssText = `position:absolute;left:${pad}%;top:${pad}%;width:${100 - 2 * pad}%;height:${100 - 2 * pad}%;` +
  (J.shape === 'circle' ? 'border-radius:50%;' : J.shape === 'squircle' ? 'border-radius:22.5%;' : '');
if (J.background) document.body.style.background = J.background;
document.body.appendChild(im);
</script></body></html>
