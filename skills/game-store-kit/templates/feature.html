<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  .shot { position: absolute; right: 0; top: 0; bottom: 0; width: 64%; overflow: hidden;
          mask-image: linear-gradient(90deg, transparent 0%, #000 24%); }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .brand { position: absolute; left: 6%; top: 0; bottom: 0; width: 46%; display: flex; flex-direction: column; justify-content: center; gap: 14px; z-index: 4; }
  .icon { width: 132px; height: 132px; border-radius: 30px; overflow: hidden; box-shadow: 0 0 0 4px rgba(255,255,255,.2), 0 24px 50px rgba(0,0,0,.5); }
  .icon img { width: 100%; height: 100%; }
  .logo { max-width: 100%; max-height: 230px; object-fit: contain; object-position: left center; filter: drop-shadow(0 14px 24px rgba(0,0,0,.4)); }
  h1 { font-size: 72px; height: 150px; overflow: hidden; display: flex; align-items: flex-end; }
  .sub { font-size: 24px; }
</style></head><body>
<script src="_base.js"></script>
<script>
const { B, J, S, el, rich, background, decor, fit } = KIT;
if (S.upper) document.body.classList.add('upper');
background(document.body, { burstAt: '22% 50%' });
const shot = el('div', 'shot'); const si = el('img'); si.src = J.image; if (J.crop) si.style.objectPosition = J.crop; shot.appendChild(si); document.body.appendChild(shot);
const b = el('div', 'brand');
if (!J.noIcon && (J.icon || B.iconPng)) { const ic = el('div', 'icon'); const im = el('img'); im.src = J.icon || B.iconPng; ic.appendChild(im); b.appendChild(ic); }
let h1 = null;
if (B.logo && !J.textTitle) { const lg = el('img', 'logo'); lg.src = B.logo; b.appendChild(lg); }
else { h1 = el('h1', null, rich(J.headline || B.name)); b.appendChild(h1); }
if (J.sub ?? B.tagline) b.appendChild(el('div', 'sub', rich(J.sub ?? B.tagline)));
document.body.appendChild(b);
decor(document.body);
window.LAYOUT = () => h1 && fit(h1, 84, 40);
</script></body></html>
