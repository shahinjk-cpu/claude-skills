<html lang="en">

<title>Code Atlas</title>

<!-- written by scan.mjs from theme.json; everything stays inside this folder (Safari blocks files outside it) -->
<link rel="stylesheet" href="assets/theme.css">
<script>(function (r) { var t = null; try { t = localStorage.getItem('code-atlas:' + location.pathname + ':theme'); } catch (e) {} r.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })(document.documentElement)</script>
<style>
  :root { --shadow: 0 12px 32px rgba(15, 15, 15, .10); }
  :root[data-theme="dark"] { --shadow: 0 12px 32px rgba(0, 0, 0, .45); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--font-b); display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
  header > * { flex-shrink: 0; } header .crumbs { flex-shrink: 1; min-width: 0; } /* a long path shrinks; the panel never leaves the screen */
  button { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: var(--font-m); }

  /* top bar */
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--bg); position: relative; z-index: 5; flex-wrap: nowrap; }
  .brand { font: 700 19px var(--font-h); letter-spacing: -.6px; white-space: nowrap; }
  .brand .pre { color: var(--dim); font-weight: 500; }
  .brand i { font-style: normal; color: var(--g); }
  .crumbs { display: flex; align-items: center; gap: 4px; font: 400 13px var(--font-m); color: var(--muted); min-width: 0; flex: 0 1 auto; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
  .crumbs > * { flex: none; } .crumbs b { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  .crumbs button { background: none; border: 0; padding: 3px 6px; border-radius: 6px; color: var(--muted); }
  .crumbs button:hover { color: var(--text); background: var(--s2); }
  .crumbs b { color: var(--text); font-weight: 600; padding: 3px 6px; border-radius: 6px; }
  .crumbs b.flash { animation: crumbflash 1.2s ease-out; }
  @keyframes crumbflash { 0% { background: var(--g); color: var(--on-g); } 100% { background: transparent; } }
  .spacer { flex: 1; }
  .search { position: relative; }
  .search input { width: 210px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--s1); color: var(--text); font: 400 13px var(--font-m); }
  .search input:focus { outline: 2px solid var(--g); outline-offset: 1px; }
  .results { position: absolute; top: 40px; right: 0; width: 390px; max-height: 60vh; overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); display: none; list-style: none; padding: 6px; }
  .results.on { display: block; }
  .results li button { width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
  .results li button:hover, .results li button.cur { background: var(--s2); }
  .results .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .results small { color: var(--muted); font: 400 11px var(--font-m); display: block; }
  .tbtn { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font: 400 12px var(--font-m); letter-spacing: .1em; text-transform: uppercase; color: var(--copy); white-space: nowrap; }
  .tbtn:hover { border-color: var(--g); color: var(--text); }
  .prog { display: flex; align-items: center; gap: 8px; font: 400 12px var(--font-m); color: var(--muted); white-space: nowrap; }
  .prog .bar { width: 90px; height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden; }
  .prog .bar i { display: block; height: 100%; background: var(--g); }

  /* stage */
  main { display: grid; grid-template-columns: 1fr 430px; min-height: 0; }
  .stage { position: relative; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--s3) 1px, transparent 1px); background-size: 20px 20px; cursor: grab; }
  .stage.drag { cursor: grabbing; }
  .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .levelhint { position: absolute; left: 22px; top: 16px; right: 22px; pointer-events: none; z-index: 1; }
  .levelhint .k { font: 400 11px var(--font-m); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .levelhint .k i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .levelhint h1 { font: 700 30px/1.15 var(--font-h); letter-spacing: -.8px; margin-top: 4px; }
  .levelhint h1 .gchip { background: var(--g); color: var(--on-g); padding: 0 8px; border-radius: 8px; }
  .levelhint p { color: var(--muted); font-size: 14px; max-width: 680px; margin-top: 4px; }
  .legend { position: absolute; left: 18px; bottom: 14px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; font: 400 11px var(--font-m); color: var(--muted); max-width: calc(100% - 90px); z-index: 2; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .zoomctl { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
  .zoomctl button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font: 600 16px var(--font-m); color: var(--text); }
  .zoomctl button:hover { border-color: var(--g); }
  #world.out { opacity: 0; }

  /* lanes: the numbered columns that give each level its structure */
  .lane rect { fill: var(--s1); stroke: var(--border); stroke-width: 1; }
  .lane .lt { font: 600 12px var(--font-m); letter-spacing: .16em; text-transform: uppercase; fill: var(--copy); }
  .lane .ln { font: 700 12px var(--font-m); fill: var(--on-g); }
  .lane .lc { fill: var(--g); }
  .lane .ls { font: 400 11px var(--font-m); fill: var(--muted); }
  .flowarrow { fill: var(--g); }

  /* cards */
  .node { cursor: pointer; }
  .node .box { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; }
  .node .tint { fill: var(--ac); opacity: .10; pointer-events: none; }
  .node .edge { fill: var(--ac); }
  .node:hover .box, .node:focus-visible .box { stroke: var(--ac); stroke-width: 2; }
  .node:focus { outline: none; }
  .node.sel .box { stroke: var(--g); stroke-width: 3; }
  .node .glow { fill: var(--g); opacity: 0; filter: blur(16px); }
  .node.sel .glow { opacity: .55; }
  .node.ghost .box { stroke-dasharray: 5 4; fill: var(--s1); }
  .node.ghost .edge { opacity: .5; }
  .node.dim { opacity: .25; }
  .node .stack { fill: var(--bg); stroke: var(--border); }
  .node .t { font: 700 15px var(--font-h); fill: var(--text); letter-spacing: -.2px; }
  .node.area .t { font: 700 22px var(--font-h); letter-spacing: -.5px; }
  .node .s { font: 400 11px var(--font-m); fill: var(--muted); }
  .node.area .s { font-size: 12px; }
  .node .numl { font-size: 10px; }
  .node .badge rect { fill: var(--ac); opacity: .22; }
  .node .badge text { font: 600 10px var(--font-m); letter-spacing: .08em; fill: var(--at); }
  .node .ico > rect { fill: var(--ac); }
  .node .ico path, .node .ico .g { fill: none; stroke: var(--on-g); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .node .ptrack { fill: var(--s3); }
  .node .pfill { fill: var(--ac); }
  .node .num { font: 700 26px var(--font-h); fill: var(--at); letter-spacing: -.5px; }
  .node .numl { font: 400 10px var(--font-m); letter-spacing: .12em; fill: var(--muted); }
  .dot-ok { fill: var(--g); } .dot-missing { fill: none; stroke: var(--dim); stroke-width: 1.5; } .dot-stale { fill: var(--blog); }
  .tick { fill: var(--g); } .tick-mark { stroke: var(--on-g); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* wires */
  .wire { fill: none; stroke: var(--dim); stroke-width: 1.4; opacity: .55; }
  .wire.imports, .wire.styles { stroke-dasharray: 2 4; }
  .wire.runs, .wire.reads { stroke-dasharray: 7 5; }
  .wire.hot { stroke: var(--g); stroke-width: 2.6; opacity: 1; }
  .wire.dim { opacity: .08; }
  .flow { fill: var(--g); }
  @media (prefers-reduced-motion: reduce) { .flow { display: none; } }

  /* side panel */
  aside { border-left: 1px solid var(--border); overflow: auto; padding: 24px 24px 64px; background: var(--bg); }
  .plabel { font: 400 11px var(--font-m); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); font: 400 11px var(--font-m); letter-spacing: .08em; color: var(--copy); text-transform: uppercase; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  aside h2 { font: 700 26px/1.2 var(--font-h); letter-spacing: -.5px; margin: 10px 0 4px; word-break: break-word; }
  aside .path { font: 400 12px var(--font-m); color: var(--muted); word-break: break-all; }
  aside h3 { font: 400 11px var(--font-m); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
  aside p { color: var(--copy); }
  aside .what { font-size: 18px; line-height: 1.5; color: var(--text); margin-top: 16px; }
  .example { background: var(--gbg); border: 1px solid var(--gborder); border-radius: 12px; padding: 12px 14px; color: var(--copy); }
  .pending { background: var(--s1); border: 1px dashed var(--dim); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 14px; margin-top: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--s1); border-radius: 999px; padding: 4px 11px; font: 400 12px var(--font-m); color: var(--copy); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .chip:hover { border-color: var(--g); color: var(--text); }
  .chip.lib { cursor: default; } .chip.lib:hover { border-color: var(--border); }
  .act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .btn { border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 9px 16px; font: 500 14px var(--font-b); color: var(--text); }
  .btn.pri { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.got { background: var(--g); color: var(--on-g); border-color: var(--g); }
  .btn:hover { border-color: var(--g); }
  .btn:disabled { opacity: .4; cursor: default; }
  details { margin-top: 24px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  summary { cursor: pointer; padding: 10px 14px; font: 400 12px var(--font-m); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  pre { margin: 0; padding: 14px; border-top: 1px solid var(--border); background: var(--s1); font: 400 12px/1.65 var(--font-m); color: var(--text); overflow: auto; max-height: 60vh; tab-size: 2; }
  .term { border: 0; border-bottom: 1px dashed var(--gt); cursor: help; background: none; padding: 0; color: inherit; font: inherit; }
  /* interactive code */
  .code { margin-top: 24px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .code .bar { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .code .bar .t { font: 400 11px var(--font-m); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); flex: 1; }
  .code .bar button { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 5px 10px; font: 500 12px var(--font-m); color: var(--text); }
  .code .bar button.nx { background: var(--g); border-color: var(--g); color: var(--on-g); }
  .code .bar button:disabled { opacity: .35; cursor: default; }
  .code .cap { padding: 10px 14px; font-size: 14px; color: var(--copy); background: var(--gbg); border-bottom: 1px solid var(--gborder); }
  .code .cap b { font: 600 11px var(--font-m); color: var(--gt); letter-spacing: .08em; margin-right: 6px; }
  .code .lines { max-height: 56vh; overflow: auto; background: var(--s1); font: 400 12px/1.7 var(--font-m); padding: 6px 0; }
  .cl { display: flex; gap: 10px; padding: 0 10px 0 0; cursor: pointer; border-left: 3px solid transparent; }
  .cl:hover { background: var(--s2); }
  .cl .no { width: 38px; position: relative; flex: none; text-align: right; color: var(--dim); user-select: none; }
  .cl .tx { white-space: pre; color: var(--text); flex: 1; }
  .cl:has(.go) .no { color: var(--gt); font-weight: 600; }
  .code .lines { position: relative; }
  .cl.own { background: color-mix(in srgb, var(--g) 7%, transparent); }
  .cl.cur { background: color-mix(in srgb, var(--g) 22%, transparent); border-left-color: var(--g); }
  .cl { width: max-content; min-width: 100%; }
  .cl .tx { flex: none !important; }
  .cl .go { position: sticky; right: 6px; margin-left: auto; white-space: nowrap; flex: none; align-self: center; font: 600 10px var(--font-m); color: var(--gt); border: 1px solid var(--gborder); background: var(--gbg); border-radius: 999px; padding: 0 7px; line-height: 16px; }
  .gloss dt { font: 700 16px var(--font-h); margin-top: 16px; color: var(--text); }
  .gloss dd { color: var(--copy); margin: 2px 0 0; }
  .tourlist button { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 14px; margin-top: 10px; }
  .tourlist button:hover { border-color: var(--g); }
  .tourlist b { font: 700 16px var(--font-h); display: block; }
  .tourlist span span { color: var(--muted); font-size: 13px; }
  .num-c { width: 28px; height: 28px; border-radius: 50%; background: var(--g); color: var(--on-g); font: 700 13px var(--font-m); display: grid; place-items: center; }
  .tourbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 70px; width: min(680px, calc(100% - 32px)); background: var(--bg); border: 1.5px solid var(--g); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: none; z-index: 3; }
  .tourbar.on { display: block; }
  .tourbar p { color: var(--text); margin: 6px 0 12px; }
  .tourbar .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .steps { display: flex; gap: 5px; flex-wrap: wrap; }
  .steps button { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--gborder); background: var(--bg); font: 600 10px var(--font-m); color: var(--muted); padding: 0; }
  .steps button.done { background: var(--gbg); color: var(--gt); }
  .steps button.cur { background: var(--g); border-color: var(--g); color: var(--on-g); }
  .warn { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--blog-bg); border: 1px solid var(--blog-border); color: var(--copy); font-size: 13px; }
  .keygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 8px; }
  .keygrid span { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--copy); }
  .keygrid i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  /* beginner layer */
  .tbtn.beg { display: inline-flex; align-items: center; gap: 8px; }
  .tbtn.beg i { width: 26px; height: 14px; border-radius: 7px; background: var(--s3); position: relative; transition: background .2s; }
  .tbtn.beg i::after { content: ''; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); transition: left .2s; }
  .tbtn.beg.on i { background: var(--g); } .tbtn.beg.on i::after { left: 14px; }
  .lvact { display: flex; gap: 8px; margin-top: 10px; pointer-events: auto; }
  .lvact .btn { padding: 7px 14px; font-size: 13px; }
  .btn.play { background: var(--g); border-color: var(--g); color: var(--on-g); font-weight: 600; }
  .wlab rect { fill: var(--bg); stroke: var(--border); }
  .wlab text { font: 500 11px var(--font-m); fill: var(--copy); }
  .wlab.hot rect { stroke: var(--g); fill: var(--gbg); } .wlab.hot text { fill: var(--text); }
  .wlab.dim { opacity: .15; }
  .node .badge.job rect { opacity: 1; fill: var(--bg); stroke: var(--ac); stroke-width: 1.5; }
  .node .badge.job path { fill: none; stroke: var(--at); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .rowlab { font: 600 11px var(--font-m); letter-spacing: .14em; fill: var(--muted); }
  .rowlab.me { fill: var(--gt); }
  .io { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 16px; }
  .io > div { border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; background: var(--s1); }
  .io > div.mid { background: var(--gbg); border-color: var(--gborder); }
  .io b { display: block; font: 600 11px var(--font-m); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .io .arrow { text-align: center; color: var(--gt); font: 700 14px var(--font-m); border: 0; background: none; padding: 0; margin: -4px 0; }
  .jobline { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--s1); border: 1px solid var(--border); font-size: 14px; color: var(--copy); }
  .jobline b { color: var(--text); }
  .plainlist li { margin: 6px 0 0 18px; color: var(--copy); }
  .jobs dt { font: 700 15px var(--font-h); margin-top: 10px; } .jobs dd { color: var(--copy); margin: 0; font-size: 14px; }
  .scopenote { margin-top: 10px; font: 400 12px var(--font-m); color: var(--muted); pointer-events: none; }
  /* view switch */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; background: var(--s1); }
  .seg button { border: 0; background: none; border-radius: 7px; padding: 5px 12px; font: 500 12px var(--font-m); letter-spacing: .06em; color: var(--muted); }
  .seg button.on { background: var(--g); color: var(--on-g); }
  /* story mode */
  .story { position: absolute; inset: 0; top: 150px; display: flex; flex-direction: column; background: var(--bg); z-index: 1; }
  .story[hidden], .tbtn.beg[hidden] { display: none; }
  .story svg { flex: 1; width: 100%; min-height: 0; }
  .story .sbar { padding: 14px 22px 18px; border-top: 1px solid var(--border); display: grid; gap: 10px; background: var(--bg); }
  .story .scap { font: 700 24px/1.3 var(--font-h); letter-spacing: -.4px; color: var(--text); }
  .story .srow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .town-ground { fill: var(--s2); } .town-line { stroke: var(--bg); stroke-width: 4; stroke-dasharray: 22 18; }
  .house { transition: opacity .5s; } .house.enter { cursor: pointer; } .house.enter:hover .body { stroke-width: 3.5; } .house.off { opacity: .28; }
  .house .body { fill: color-mix(in srgb, var(--ac) 16%, var(--bg)); stroke: var(--ac); stroke-width: 2; }
  .house .roof { fill: var(--ac); }
  .house .door { fill: var(--bg); stroke: var(--ac); stroke-width: 2; }
  .house .win { fill: var(--bg); stroke: var(--ac); stroke-width: 1.5; }
  .house .person { fill: var(--text); } .house .face { fill: var(--bg); stroke: var(--text); stroke-width: 2.5; }
  .house .sign { font: 700 16px var(--font-h); fill: var(--text); } .house .tag { font: 500 13px var(--font-m); fill: var(--muted); }
  .house .badge { fill: var(--bg); stroke: var(--ac); stroke-width: 2; } .house .badge path { fill: none; stroke: var(--at); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .spot { fill: var(--g); opacity: .3; filter: blur(6px); }
  .bubble { background: var(--bg); border: 2px solid var(--text); border-radius: 16px; padding: 10px 14px; font: 600 17px/1.35 var(--font-b); color: var(--text); position: relative; text-align: center; }
  .bubble.reply { border-color: var(--g); background: var(--gbg); }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -10px; width: 16px; height: 16px; background: inherit; border-right: 2px solid; border-bottom: 2px solid; border-color: inherit; transform: translateX(-50%) rotate(45deg); }
  .late { opacity: 0; animation: appear .5s ease forwards; animation-delay: var(--d, 2s); }
  @keyframes appear { to { opacity: 1; } }
  .parcel rect.env { fill: var(--bg); stroke: var(--text); stroke-width: 2; } .parcel path { fill: none; stroke: var(--text); stroke-width: 2; }
  .parcel.back rect.env { stroke: var(--gt); fill: var(--gbg); } .parcel.back path { stroke: var(--gt); }
  .plabel2 { display: inline-block; background: var(--text); color: var(--bg); border-radius: 999px; padding: 4px 12px; font: 500 13px var(--font-m); white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  .parcel.back .plabel2 { background: var(--g); color: var(--on-g); }
  .roadpath { fill: none; stroke: var(--dim); stroke-width: 2; stroke-dasharray: 3 7; }
  .quiz { flex: 1; overflow: auto; padding: 20px 28px; display: grid; gap: 16px; align-content: start; }
  .quiz .q { border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; }

<script src="data.js"></script>
<script>
const M = window.MAP, N = new Map(M.nodes.map(n => [n.id, n]));

const ICON = new Proxy({}, { get: (_, k) => ICONS[M.areas[k]?.icon] || ICONS.box });

// progress: boxes marked "I understand this" (kept in this browser only)

const learnable = M.nodes.filter(n => n.kind === 'fn' || n.kind === 'file');

// ---------- what each level shows ----------

// ---------- lanes: every level reads left to right, one numbered column per role ----------

  ['group', 'Groups', 'click one to open it'],
  ['blocks', 'Building blocks', 'components and layouts'],
