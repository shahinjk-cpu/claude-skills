<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<style>
  :root { --panel: rgba(12, 18, 24, 0.66); --ink: #eef3f6; --muted: #a9b7c0; --accent: #e0457b; }
  html, body { margin: 0; height: 100%; background: #0b1116; color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 16px; top: 16px; max-width: min(330px, calc(100vw - 32px)); background: var(--panel);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 12px 14px; }
  #ui h1 { margin: 0 0 2px; padding-right: 34px; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  #ui .sub { color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button { background: rgba(255,255,255,.1); color: var(--ink); border: 1px solid rgba(255,255,255,.14); border-radius: 8px;
           padding: 6px 9px; font: inherit; cursor: pointer; text-transform: capitalize; }
  button:hover { background: rgba(255,255,255,.18); }
  button.on { background: var(--accent); border-color: var(--accent); }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #help { color: var(--muted); margin-top: 8px; font-size: 12px; }
  a.lnk { color: var(--ink); text-decoration: none; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 6px 9px; background: rgba(224,69,123,.22); }
  a.lnk:hover { background: rgba(224,69,123,.4); }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1116; z-index: 5; font-size: 14px; color: var(--muted); }
  #hide { position: absolute; right: 8px; top: 8px; padding: 2px 7px; }
  #ui.min > :not(h1):not(#hide) { display: none; }
  #credit { position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: rgba(255,255,255,.7); text-shadow: 0 1px 2px #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js",
  "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@1.10.1/dist/N8AO.js"
} }
</script>
</head>
<body>
<div id="load">Building the place…</div>
<div id="ui">
  <button id="hide" title="Hide panel">–</button>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="row" id="views"></div>
  <label>Time <input id="sun" type="range" min="-12" max="80" value="45"></label>
  <div id="help">Drag to orbit · scroll to zoom · right-drag to pan</div>
  <div class="row" id="links"></div>
</div>
<div id="credit"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { N8AOPass } from 'n8ao';

const META = %%META%%;
const DATA_B64 = "%%DATA%%";
const H = META.height, RG = META.radius, FAR = META.far, FL = META.floor;
document.getElementById('title').textContent = META.name;
document.getElementById('sub').textContent = `${Math.round(RG)} m radius · built from real map data`;
document.getElementById('credit').textContent = META.attribution + ' · placeforge';

// ------------------------------------------------------------------ renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const ZUP = new THREE.Group();            // everything is authored in the engine's axes: x east, y north, z up
ZUP.rotation.x = -Math.PI / 2;
scene.add(ZUP);
const W = (x, y, z) => new THREE.Vector3(x, z, -y);
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 1.5, 120000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.5 - 0.01;
controls.minDistance = 8;
controls.maxDistance = Math.max(FAR * 1.2, 4000);
const lin = (c) => new THREE.Color().setRGB(c[0], c[1], c[2]);
const nightU = { value: 0 }, timeU = { value: 0 };

const GLSL_NOISE = `
float hash3(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float vnoise(vec3 p) { vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1,0,0)), f.x), mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x), mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; } return s; }`;

// ------------------------------------------------------------------ sky
const skyU = { sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunset: { value: 0 }, night: nightU };
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: skyU, fog: false,
  vertexShader: `varying vec3 vD; void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 sunDir; uniform float sunset, night; varying vec3 vD; ${GLSL_NOISE}
    void main() { vec3 d = normalize(vD); float h = max(d.y, 0.0);
      vec3 zen = vec3(0.05, 0.22, 0.60), hor = vec3(0.50, 0.66, 0.78);
      vec3 c = mix(hor, zen, pow(h, 0.45));
      float sd = max(dot(d, sunDir), 0.0);
      vec3 warm = mix(vec3(1.0, 0.55, 0.22), vec3(1.0, 0.32, 0.12), sunset);
      c = mix(c, mix(vec3(0.20, 0.24, 0.42), warm, exp(-h * 5.0)), sunset * 0.85);
      c += warm * (pow(sd, 48.0) * 0.6 + pow(sd, 900.0) * 6.0) * (1.0 - night);
      vec3 nc = mix(vec3(0.060, 0.042, 0.035), vec3(0.004, 0.006, 0.018), pow(h, 0.35));
      float st = step(0.9965, hash3(floor(d * 380.0))) * smoothstep(0.05, 0.3, h);
      nc += vec3(st) * 0.8;
      c = mix(c, nc, night);
      if (d.y < 0.0) c = mix(c, c * 0.6, min(-d.y * 6.0, 1.0));
      gl_FragColor = vec4(c, 1.0); }` });
const sky = new THREE.Mesh(new THREE.SphereGeometry(90000, 48, 24), skyMat);
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 48, 24), skyMat));
let envRT = null;
function updateEnv() { if (envRT) envRT.dispose(); envRT = pmrem.fromScene(envScene, 0, 0.1, 1000); scene.environment = envRT.texture; }

// ------------------------------------------------------------------ light
const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const SC = sun.shadow.camera;
const SR = Math.min(Math.max(RG, 400), 1100);
SC.left = SC.bottom = -SR; SC.right = SC.top = SR; SC.near = 10; SC.far = 12000;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x55603a, 0.2);
scene.add(hemi);
scene.environmentIntensity = 0.4;
scene.fog = new THREE.Fog(0xb7c6cf, Math.max(RG * 1.5, 1200), FAR * 2.2);
const sunDirW = new THREE.Vector3();
const nightHooks = [];
let bloom = null;
function setSun(el) {
  const sb = THREE.MathUtils.degToRad(el < 12 ? (META.sun.sunset_bearing ?? 262) + (META.sun.bearing - (META.sun.sunset_bearing ?? 262)) * Math.max(el, 0) / 12 : META.sun.bearing);
  const e = THREE.MathUtils.degToRad(el);
  sunDirW.copy(W(Math.sin(sb) * Math.cos(e), Math.cos(sb) * Math.cos(e), Math.sin(e))).normalize();
  skyU.sunDir.value.copy(sunDirW);
  const ss = THREE.MathUtils.smoothstep(25 - el, 0, 22), nf = THREE.MathUtils.smoothstep(-el, -2, 6);
  nightU.value = nf;
  skyU.sunset.value = ss * (1 - nf);
  sun.color.setRGB(1.0, 0.92 - 0.35 * ss, 0.80 - 0.5 * ss);
  sun.intensity = el > 0 ? 4.2 * (0.25 + 0.75 * Math.min(1, el / 20)) : 0;
  sun.castShadow = el > 0;
  hemi.intensity = 0.2 * (0.5 + 0.5 * Math.min(1, Math.max(el, 0) / 25)) * (1 - nf) + 0.10 * nf;
  scene.environmentIntensity = 0.4 * (1 - nf) + 0.15 * nf;
  renderer.toneMappingExposure = 1.15 + 0.15 * nf;
  scene.fog.color.setRGB(0.40 + 0.4 * ss, 0.52 - 0.05 * ss, 0.60 - 0.25 * ss).multiplyScalar(0.85).lerp(new THREE.Color().setRGB(0.012, 0.014, 0.025), nf);
  if (bloom) { bloom.strength = 0.2 + 0.35 * nf; bloom.threshold = 1.1 - 0.3 * nf; bloom.radius = 0.55 - 0.2 * nf; }
  for (const f of nightHooks) f(nf);
  updateEnv();
}

// ------------------------------------------------------------------ data
async function load() {
  const bytes = Uint8Array.from(atob(DATA_B64), c => c.charCodeAt(0));
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  const chunk = (c) => new Float32Array(buf, c.off, c.n * c.stride);
  return { buf, boxes: chunk(META.chunks.boxes), polys: chunk(META.chunks.polys), trees: chunk(META.chunks.trees), lamps: chunk(META.chunks.lamps) };
}

function worldVaryings(sh, extraV = '', extraF = '') {
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vW; varying vec3 vNw;' + extraV)
    .replace('#include <project_vertex>', `#include <project_vertex>
      #ifdef USE_INSTANCING
        vW = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vW = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif
      vNw = normalize(mat3(modelMatrix) * objectNormal);`);
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vW; varying vec3 vNw;\n' + GLSL_NOISE + extraF);
}

// ------------------------------------------------------------------ ground
function buildGround() {
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
  m.onBeforeCompile = sh => { worldVaryings(sh);
    sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      vec2 p = vec2(vW.x, -vW.z); float n = fbm(vec3(p * 0.02, 1.0)) * 0.7 + fbm(vec3(p * 0.15, 3.0)) * 0.3;
      vec3 c = mix(vec3(0.06, 0.09, 0.025), vec3(0.19, 0.16, 0.11), smoothstep(0.3, 0.7, n));
      float far = smoothstep(${(FAR * 0.9).toFixed(1)}, ${(FAR * 1.3).toFixed(1)}, length(p));
      float cell = hash3(vec3(floor(p / 22.0), 2.0));
      vec3 mos = cell < 0.4 ? vec3(0.05, 0.09, 0.03) : cell < 0.75 ? vec3(0.5, 0.48, 0.44) : vec3(0.35, 0.14, 0.08);
      diffuseColor.rgb = mix(c, mos, far * 0.85);`); };
  const g = new THREE.Mesh(new THREE.CircleGeometry(Math.max(FAR * 8, 30000), 96), m);
  g.receiveShadow = true;
  ZUP.add(g);
}

// ------------------------------------------------------------------ buildings (boxes + mapped footprints -> one mesh)
function buildCity(D) {
  const pos = [], col = [], att = [];                       // att: roof, glass, rnd
  const tri = (a, b, c, k, roof, glass, rnd) => { pos.push(...a, ...b, ...c); for (let i = 0; i < 3; i++) { col.push(k[0], k[1], k[2]); att.push(roof, glass, rnd); } };
  const quad = (a, b, c, d, k, roof, glass, rnd) => { tri(a, b, c, k, roof, glass, rnd); tri(a, c, d, k, roof, glass, rnd); };
  const B = D.boxes;
  for (let i = 0; i < B.length; i += 17) {
    const [cx, cy, z0, w, d, h, rot, pitch, top] = B.subarray(i, i + 9), wall = B.subarray(i + 9, i + 12), roofc = B.subarray(i + 12, i + 15), glass = B[i + 15], rnd = B[i + 16];
    const c = Math.cos(rot), s = Math.sin(rot);
    const P = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(([x, y]) => [cx + x * c - y * s, cy + x * s + y * c]);
    const lo = P.map(p => [p[0], p[1], z0]), hi = P.map(p => [p[0], p[1], z0 + h]);
    for (let k = 0; k < 4; k++) { const j = (k + 1) % 4; quad(lo[k], lo[j], hi[j], hi[k], wall, 0, glass, rnd); }
    if (pitch <= 0) { if (top) quad(hi[0], hi[1], hi[2], hi[3], roofc, 1, 0, rnd); continue; }
    const D2 = Math.min(w, d), ridge = Math.max(Math.max(w, d) - D2, 0) / 2;
    const rl = w >= d ? [[-ridge, 0], [ridge, 0]] : [[0, -ridge], [0, ridge]];
    const R = rl.map(([x, y]) => [cx + x * c - y * s, cy + x * s + y * c, z0 + h + pitch * D2]);
    if (w >= d) { quad(hi[0], hi[1], R[1], R[0], roofc, 1, 0, rnd); quad(hi[2], hi[3], R[0], R[1], roofc, 1, 0, rnd); tri(hi[1], hi[2], R[1], roofc, 1, 0, rnd); tri(hi[3], hi[0], R[0], roofc, 1, 0, rnd); }
    else { quad(hi[1], hi[2], R[1], R[0], roofc, 1, 0, rnd); quad(hi[3], hi[0], R[0], R[1], roofc, 1, 0, rnd); tri(hi[0], hi[1], R[0], roofc, 1, 0, rnd); tri(hi[2], hi[3], R[1], roofc, 1, 0, rnd); }
  }
  const Pv = D.polys;
  for (let i = 0; i < Pv.length; i += 9) { pos.push(Pv[i], Pv[i + 1], Pv[i + 2]); col.push(Pv[i + 3], Pv[i + 4], Pv[i + 5]); att.push(Pv[i + 6], Pv[i + 7], Pv[i + 8]); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aAtt', new THREE.Float32BufferAttribute(att, 3));
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 });
  m.onBeforeCompile = sh => { sh.uniforms.uNight = nightU;
    worldVaryings(sh, 'attribute vec3 aAtt; varying vec3 vAtt;', 'varying vec3 vAtt; uniform float uNight; float pfWin; vec3 pfLit;');
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\nvAtt = aAtt;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      { vec3 P = vec3(vW.x, -vW.z, vW.y), N = normalize(vec3(vNw.x, -vNw.z, vNw.y));
        float roof = vAtt.x, glass = vAtt.y, rnd = vAtt.z, FLh = ${FL.toFixed(2)};
        float wall = 1.0 - smoothstep(0.3, 0.6, abs(N.z));
        vec3 tg = normalize(cross(N, vec3(0.0, 0.0, 1.0)) + vec3(1e-5));
        float hc = dot(P, tg);
        float fz = fract(P.z / FLh + rnd * 0.7), fh = fract(hc / 3.4 + rnd * 13.7);
        float ww = 0.08 + fract(rnd * 7.3) * 0.16, wtop = 0.82 + fract(rnd * 3.1) * 0.1;
        float win = step(0.30, fz) * step(fz, wtop) * step(ww, fh) * step(fh, 1.0 - ww) * step(2.8, P.z);
        float mull = step(0.07, fract(hc / 1.6)) * step(0.1, fract(P.z / (FLh + 0.4)));
        win = mix(win, mull, glass) * wall * step(0.05, rnd) * (1.0 - roof);
        float dist = distance(vW, cameraPosition);
        float lod = 1.0 - smoothstep(700.0, 2600.0, dist);
        vec3 cellv = vec3(floor(hc / 3.4), floor(P.z / FLh), rnd * 97.0);
        float cr = hash3(cellv);
        float streak = fbm(vec3(P.xy * 0.25, P.z * 0.035));
        float shade = mix(1.0, 0.72, smoothstep(0.45, 0.75, streak)) * mix(0.7, 1.0, smoothstep(0.0, 2.5, P.z)) + step(fz, 0.07) * 0.14 * wall;
        float rpatch = mix(0.6, 1.05, smoothstep(0.3, 0.7, fbm(vec3(P.xy * 0.35, 5.0))));
        diffuseColor.rgb *= mix(shade, rpatch, roof);
        float shed = 1.0 - step(0.05, rnd);
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 0.68, shed * step(fract(hc / 0.9), 0.1) * wall * lod);
        vec3 gc = mix(vec3(0.05, 0.06, 0.065), vec3(0.16, 0.18, 0.19), cr);
        diffuseColor.rgb = mix(diffuseColor.rgb, mix(diffuseColor.rgb * 0.8, gc, lod), win);
        pfWin = win * lod;
        float lit = step(0.74, hash3(cellv + vec3(0.0, 0.0, 13.0)));
        vec3 lc = mix(vec3(1.0, 0.62, 0.30), vec3(0.75, 0.86, 1.0), step(0.9, hash3(cellv + 5.0)));
        pfLit = lc * win * lit * uNight * mix(0.35, 1.6, lod); }`)
      .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.08, pfWin);')
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += pfLit;'); };
  const mesh = new THREE.Mesh(g, m);
  mesh.castShadow = mesh.receiveShadow = true;
  ZUP.add(mesh);
  return pos.length / 9;
}

// ------------------------------------------------------------------ trees
function blob(r, cx, cy, cz, flat, seed, detail, colr) {
  const g = new THREE.IcosahedronGeometry(1, detail), p = g.attributes.position, c = [];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 0.82 + 0.36 * (Math.sin(x * 3.1 + seed) * Math.cos(y * 2.7 + seed * 1.7) * Math.sin(z * 2.3 + seed * 0.6) * 0.5 + 0.5);
    p.setXYZ(i, cx + x * r * k, cy + y * r * k, cz + z * r * k * flat);
    const sh = 0.72 + 0.4 * (z * 0.5 + 0.5);
    c.push(colr[0] * sh, colr[1] * sh, colr[2] * sh);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  g.deleteAttribute('uv');
  return g;
}
function trunk(h, r, colr = [0.10, 0.08, 0.06]) {
  const g = new THREE.CylinderGeometry(r * 0.65, r, h, 6).rotateX(Math.PI / 2).translate(0, 0, h / 2);
  g.setAttribute('color', new THREE.Float32BufferAttribute(new Array(g.attributes.position.count * 3).fill(0).map((_, i) => colr[i % 3]), 3));
  g.deleteAttribute('uv');
  return g;
}
function treeGeo(kind, simple) {
  const G = [0.10, 0.17, 0.035], rnd = (i) => { const s = Math.sin(i * 91.7 + kind * 13.1) * 43758.5; return s - Math.floor(s); };
  const parts = [], det = simple ? 0 : 1;
  if (kind === 4) {                                           // conifer
    parts.push(trunk(4, 0.3));
    for (let i = 0; i < (simple ? 2 : 5); i++) { const z = 2.2 + i * (simple ? 5 : 2.3), rr = 3.3 * (1 - i / (simple ? 2.6 : 5.6));
      const c = new THREE.ConeGeometry(rr, simple ? 7 : 3.4, 8).rotateX(Math.PI / 2).translate(0, 0, z + 1.5);
      c.setAttribute('color', new THREE.Float32BufferAttribute(new Array(c.attributes.position.count * 3).fill(0).map((_, k) => [0.03, 0.075, 0.03][k % 3]), 3)); c.deleteAttribute('uv'); parts.push(c); }
  } else if (kind === 3) {                                    // palm
    parts.push(trunk(13, 0.24));
    for (let i = 0; i < (simple ? 5 : 11); i++) { const a = i / (simple ? 5 : 11) * 6.283; parts.push(blob(1.0, Math.cos(a) * 2.2, Math.sin(a) * 2.2, 12.6 - 0.4 * rnd(i), 0.18, i, 0, G).scale(1, 1, 1)); }
    parts.push(blob(1.1, 0, 0, 13.0, 0.6, 3, 0, G));
  } else {
    const [cz, spread, flat, nb, rad] = [[7.0, 4.6, 0.6, 7, 3.3], [5.0, 2.2, 0.9, 5, 2.5], [8.0, 1.5, 1.4, 5, 2.1]][kind] || [6, 3, 0.8, 5, 2.6];
    parts.push(trunk(cz, 0.33));
    if (simple) parts.push(blob(rad * 1.7, 0, 0, cz + 0.5, flat, kind, 0, G));
    else for (let i = 0; i < nb; i++) parts.push(blob(rad * (0.65 + 0.35 * rnd(i)), (rnd(i + 20) - 0.5) * spread, (rnd(i + 40) - 0.5) * spread, cz + (rnd(i + 60) - 0.5) * 2.4 * flat, flat, i, det, G));
  }
  return mergeGeometries(parts.map(p => p.index ? p.toNonIndexed() : p));
}
function buildTrees(T) {
  const n = T.length / 5, groups = {};
